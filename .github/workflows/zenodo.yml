name: Zenodo Production Upload

on:
  # Manual backfill and re-runs only. Normal archiving happens in the
  # zenodo-upload job of release.yml, which a tag push drives end to end;
  # a `release: published` trigger here as well would be a second path to the
  # same action. Re-running is safe regardless: update_zenodo.py refuses a
  # version identical to the record's current one, so a repeat cannot mint a
  # duplicate DOI.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to upload (e.g. v2.2.0). If left empty, the latest release will be used."
        required: false
        type: string
      deposition_id:
        description: "Override the Zenodo record ID (defaults to DEPOSITION_ID in scripts/update_zenodo.py)."
        required: false
        type: string
      draft:
        description: "Keep as a draft (do not publish)."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  zenodo-upload:
    runs-on: ubuntu-latest
    # A pre-release is not the thing to mint a permanent DOI for.
    if: github.event_name != 'release' || github.event.release.prerelease == false

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download Release Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          mkdir -p dist

          if [ "$EVENT_NAME" = "release" ]; then
            TAG="$RELEASE_TAG"
          else
            TAG="$INPUT_TAG"
            if [ -z "$TAG" ]; then
              echo "No tag specified, fetching latest release tag..."
              TAG=$(gh release view --json tagName --template '{{.tagName}}')
            fi
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: invalid release tag" >&2
            exit 1
          fi
          echo "Processing tag: $TAG"
          echo "TAG=$TAG" >> $GITHUB_ENV

          # Release assets, if this release carries any.
          gh release download "$TAG" --pattern "*.zip" --dir dist --skip-existing || true

          # The source archive is always available for a tag.
          curl -L -o "dist/source.tar.gz" "https://github.com/${{ github.repository }}/archive/refs/tags/${TAG}.tar.gz"

          echo "Downloaded assets:"
          ls -la dist/

      - name: Upload and Publish to Zenodo
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
          INPUT_DEPOSITION: ${{ github.event.inputs.deposition_id }}
          INPUT_DRAFT: ${{ github.event.inputs.draft }}
        run: |
          args=()
          if [ -n "$INPUT_DEPOSITION" ]; then
            if [[ ! "$INPUT_DEPOSITION" =~ ^[0-9]+$ ]]; then
              echo "ERROR: invalid deposition ID" >&2
              exit 1
            fi
            args+=(--deposition-id "$INPUT_DEPOSITION")
          fi
          if [ "$INPUT_DRAFT" != "true" ]; then
            args+=(--publish)
          fi
          python scripts/update_zenodo.py "${args[@]}" --version-string "$TAG" dist/*
