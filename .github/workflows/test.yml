name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: pip install pytest pytest-cov

      - name: Run tests
        run: pytest tests/ -v --tb=short --cov=mcp_server --cov-report=term-missing

  test-integration:
    name: Integration (with main app)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Clone main app
        uses: actions/checkout@v4
        with:
          repository: HiroYokoyama/python_molecular_editor
          path: python_molecular_editor
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pytest pytest-cov
          pip install -e python_molecular_editor/moleditpy/ || true

      - name: Run tests (including integration)
        run: pytest tests/ -v --tb=short
