name: Tests

on:
  workflow_dispatch:
    inputs:
      moleditpy_ref:
        description: 'MoleditPy branch, tag, or full commit SHA (blank uses repository default)'
        required: false
        type: string
        default: ''
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  MOLEDITPY_REF: ${{ inputs.moleditpy_ref || vars.MOLEDITPY_REF || 'main' }}
  PYTEST_QT_API: pyside6
  QT_API: pyside6
  QT_QPA_PLATFORM: offscreen

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        # rdkit so the real-RDKit apply_reaction_smarts regression tests run
        # instead of skipping: the rest of the suite mocks RDKit and cannot
        # express a valence violation.
        run: pip install pytest pytest-cov rdkit

      - name: Run tests
        run: pytest tests/ -v --tb=short --cov=mcp_server --cov-report=term-missing

  test-integration:
    name: Integration (with moleditpy)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: sudo apt-get install -y libegl1 libgl1

      - name: Install dependencies
        shell: bash
        run: |
          git init "../python_molecular_editor"
          git -C "../python_molecular_editor" remote add origin https://github.com/HiroYokoyama/python_molecular_editor.git
          git -C "../python_molecular_editor" fetch --depth 1 origin "$MOLEDITPY_REF"
          git -C "../python_molecular_editor" checkout --detach FETCH_HEAD
          git -C "../python_molecular_editor" log -1 --format="%H %s"
          pip install pytest ../python_molecular_editor/moleditpy

      - name: Run integration tests
        # test_integration_xyz_charge drives the app's real XYZ loader (real
        # RDKit bond perception) to catch changes to the charge-prompt hook;
        # test_integration_unsaved_changes pins the unsaved-changes check.
        env:
          MOLEDITPY_HEADLESS: "1"
          QT_QPA_PLATFORM: offscreen
        run: pytest tests/test_plugin_integration.py tests/test_integration_xyz_charge.py tests/test_integration_unsaved_changes.py tests/test_integration_overlay_contract.py tests/test_api.py tests/test_status_ui.py -v --tb=short
