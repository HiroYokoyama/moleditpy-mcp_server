[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-gui-tester"
version = "1.0.0a1"
description = "Lightweight PySide6 GUI tester for MCP servers over Streamable HTTP: list tools, fill parameters from each inputSchema, call tools, and inspect results."
readme = "README.md"
license = { text = "LGPL-3.0-or-later" }
authors = [{ name = "HiroYokoyama" }]
requires-python = ">=3.10"
dependencies = ["PySide6-Essentials>=6.9,<6.12"]
keywords = [
    "mcp",
    "model-context-protocol",
    "gui",
    "tester",
    "json-rpc",
    "developer-tools",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Lesser General Public License v3 (LGPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]

[project.scripts]
mcp-gui-tester = "mcp_gui_tester.app:main"

[project.urls]
Homepage = "https://github.com/HiroYokoyama/moleditpy-mcp_server"
Source = "https://github.com/HiroYokoyama/moleditpy-mcp_server/tree/main/mcp_gui_tester"
Issues = "https://github.com/HiroYokoyama/moleditpy-mcp_server/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
license-files = ["LICENSE", "COPYING", "LICENSING.md"]
